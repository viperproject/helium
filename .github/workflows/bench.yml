name: Benchmark

# Runs the full benchmark suite (runner/suite.ci.json of the Data repo) on the
# self-hosted benchmark machine, for exactly:
# - the head commit of a PR when it is opened or new commits are (force) pushed to it;
# - the last commit of every push to main.
# Nothing here removes data: closing a PR leaves its runs in the database, and
# `runner sync` / `runner close-pr` are never called.
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The Data repo (runner, suites, CI config), pinned so benchmark changes reach
  # CI only through a Helium commit that bumps the pin.
  BENCH_DATA_REPO: The-Ray-Man/HeliumBenchmarkData
  BENCH_DATA_REF: c572628f73c084ebc1a67476deeada40c24f1a5c

jobs:
  benchmark:
    # PRs from forks never run on the self-hosted runner: it would run their code.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [ self-hosted, bench ]
    timeout-minutes: 7200 # 5 days, the limit for self-hosted runners

    # A new push to a PR cancels the run of its previous head, which ends as
    # CANCELLED (its rows are kept). Each main commit gets a group of its own,
    # so none is cancelled or dropped: they queue for the runner instead (a
    # shared group would keep only the last of several pending runs).
    concurrency:
      group: bench-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.sha) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The PR's head, not GitHub's merge commit, so the stored commit is a real
      # one; on a push, the last pushed commit.
      HELIUM_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:

      - name: Benchmark
        working-directory: /opt/bench/runner
        run: >
          "./target/release/runner" bench
          --ci
          --run-id "$RUN_ID"
          --helium-commit "$HELIUM_COMMIT"
          --github-run-url "$RUN_URL"
