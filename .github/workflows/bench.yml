on:
  workflow_dispatch:
  push:
    branches: [ setup-local-runner ]

jobs:
  hello:
    runs-on: [ self-hosted, bench ]
    timeout-minutes: 7200 # 5 days

    defaults:
      run:
        working-directory: /opt/bench/runner
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - run: ./target/release/runner index
