name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # z3-sys downloads a prebuilt, statically linked Z3 from the Z3Prover GitHub
  # releases (enabled via `--features z3/gh-release` below).
  Z3_SYS_Z3_VERSION: "5.1.0"
  READ_ONLY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: suite + perf_regression
    runs-on: ubuntu-24.04  # glibc 2.39, matches the Z3 release asset
    steps:
      - uses: actions/checkout@v4

      # Installs the nightly toolchain pinned in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Build tests
        run: cargo test --locked --features z3/gh-release --test suite --test perf_regression --no-run

      - name: Run suite.rs
        run: cargo test --locked --features z3/gh-release --test suite

      - name: Run perf_regression.rs
        run: cargo test --locked --features z3/gh-release --test perf_regression
